<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512">
  <!-- Make renders black as white and transparent as the theme color (#f25c2c). -->
  <defs>
    <mask id="cut">
      <rect x="0" y="0" width="32" height="32" fill="#fff"/>
      <rect x="2" y="13.2" width="28" height="1.6" fill="#000"/>
      <text x="16" y="27" text-anchor="middle" fill="#000" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="700" letter-spacing="-0.5">42</text>
    </mask>
    <clipPath id="body"><rect x="2" y="5" width="28" height="26" rx="3"/></clipPath>
  </defs>
  <rect x="8" y="1" width="2.5" height="5" rx="1.2" fill="#000"/>
  <rect x="21.5" y="1" width="2.5" height="5" rx="1.2" fill="#000"/>
  <g mask="url(#cut)">
    <rect x="2" y="5" width="28" height="26" rx="3" fill="#000"/>
  </g>
  <g clip-path="url(#body)" mask="url(#cut)">
    <rect x="2" y="5" width="28" height="8.2" fill="#fff" fill-opacity="0.45"/>
  </g>
</svg>
